services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dapuremakita
      POSTGRES_PASSWORD: dapuremakita
      POSTGRES_DB: dapuremakita
    ports:
      - "5432:5432"
    volumes:
      - dapuremakita_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dapuremakita -d dapuremakita"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  dapuremakita_pgdata:
